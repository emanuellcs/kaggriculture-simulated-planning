name: CI/CD

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-test:
    name: Build and test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build C++ extension
        run: cmake --build build -j"$(nproc)"
      - name: Run pytest suite
        run: PYTHONPATH=build python -m pytest -q tests
      - name: Run differential rules-fidelity check
        run: PYTHONPATH=build python scripts/diffcheck.py --games 2 --steps 40
      - name: Run benchmark smoke
        run: PYTHONPATH=build python scripts/bench.py --seeds 1 --steps 120 --timeout 30
      - name: Run profiling perf gate
        run: PYTHONPATH=build python scripts/profiling.py --calls 30 --max-p95 50
      - name: Upload compiled extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-engine-ubuntu-py${{ matrix.python-version }}
          path: |
            build/kaggriculture_engine*.so
            build/compile_commands.json
          if-no-files-found: error
          retention-days: 14

  sanitize:
    name: ASan/UBSan build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Configure sanitizer build
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer extension
        run: cmake --build build-asan -j"$(nproc)"
      - name: Run tests under sanitizers
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          PYTHONPATH=build-asan python -m pytest -q tests

  package:
    name: Package source bundle
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Create source package
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='.github' --exclude='build' --exclude='dist' \
            --exclude='__pycache__' --exclude='.pytest_cache' \
            -czf dist/kaggriculture-simulated-planning-source.tar.gz .
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-simulated-planning-source
          path: dist/kaggriculture-simulated-planning-source.tar.gz
          if-no-files-found: error
          retention-days: 30
